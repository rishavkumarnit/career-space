<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" role="img" aria-labelledby="title desc">
  <title id="title">EventFlow Commerce high-level architecture</title>
  <desc id="desc">A diagram showing the public request path and service boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <marker id="eventArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
    <style>.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 17px Arial,sans-serif;fill:#475569}.label{font:700 19px Arial,sans-serif;fill:#0f172a}.small{font:400 15px Arial,sans-serif;fill:#334155}.tiny{font:400 13px Arial,sans-serif;fill:#475569}.box{stroke:#94a3b8;stroke-width:2;rx:12}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.event{stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#eventArrow)}</style>
  </defs>
  <rect width="1600" height="610" fill="#f8fafc"/>
  <text x="60" y="55" class="title">EventFlow Commerce — High-Level Design</text><text x="60" y="84" class="subtitle">Public request paths and private service boundaries.</text>
  <rect x="40" y="110" width="1520" height="460" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="150" class="label">1. Public request path and service boundaries</text>
  <rect x="80" y="205" width="180" height="72" class="box" fill="#dbeafe"/><text x="170" y="236" text-anchor="middle" class="label">User</text><text x="170" y="260" text-anchor="middle" class="small">Browser</text>
  <rect x="340" y="185" width="240" height="90" class="box" fill="#e0f2fe"/><text x="460" y="222" text-anchor="middle" class="label">React Frontend</text><text x="460" y="248" text-anchor="middle" class="small">Render Static Site</text>
  <rect x="340" y="335" width="240" height="90" class="box" fill="#fef3c7"/><text x="460" y="372" text-anchor="middle" class="label">Keycloak</text><text x="460" y="398" text-anchor="middle" class="small">Google login → JWT</text>
  <rect x="675" y="225" width="260" height="90" class="box" fill="#dcfce7"/><text x="805" y="262" text-anchor="middle" class="label">API Gateway</text><text x="805" y="288" text-anchor="middle" class="small">Public • JWT validation</text>
  <rect x="1025" y="160" width="210" height="64" class="box" fill="#f1f5f9"/><text x="1130" y="198" text-anchor="middle" class="label">Order Service</text><rect x="1025" y="245" width="210" height="64" class="box" fill="#f1f5f9"/><text x="1130" y="283" text-anchor="middle" class="label">Product Catalog</text><rect x="1025" y="330" width="210" height="64" class="box" fill="#f1f5f9"/><text x="1130" y="368" text-anchor="middle" class="label">Payment Service</text><rect x="1025" y="415" width="210" height="64" class="box" fill="#f1f5f9"/><text x="1130" y="453" text-anchor="middle" class="label">Inventory Service</text>
  <rect x="1320" y="150" width="180" height="70" class="box" fill="#ede9fe"/><text x="1410" y="180" text-anchor="middle" class="label">order_db</text><text x="1410" y="202" text-anchor="middle" class="tiny">PostgreSQL</text><rect x="1320" y="235" width="180" height="70" class="box" fill="#ede9fe"/><text x="1410" y="265" text-anchor="middle" class="label">product_db</text><text x="1410" y="287" text-anchor="middle" class="tiny">PostgreSQL</text><rect x="1320" y="320" width="180" height="70" class="box" fill="#ede9fe"/><text x="1410" y="350" text-anchor="middle" class="label">payment_db</text><text x="1410" y="372" text-anchor="middle" class="tiny">PostgreSQL</text><rect x="1320" y="405" width="180" height="70" class="box" fill="#ede9fe"/><text x="1410" y="435" text-anchor="middle" class="label">inventory_db</text><text x="1410" y="457" text-anchor="middle" class="tiny">PostgreSQL</text>
  <path d="M260 241 H340" class="arrow"/><text x="300" y="225" text-anchor="middle" class="tiny">uses</text><path d="M460 275 V335" class="arrow"/><text x="485" y="316" class="tiny">login</text><path d="M580 230 H675" class="arrow"/><text x="628" y="214" text-anchor="middle" class="tiny">HTTPS + JWT</text><path d="M935 270 H985 V192 H1025" class="arrow"/><path d="M935 270 H1025" class="arrow"/><path d="M935 270 H985 V362 H1025" class="arrow"/><path d="M935 270 H985 V447 H1025" class="arrow"/><path d="M1235 192 H1320" class="arrow"/><path d="M1235 277 H1320" class="arrow"/><path d="M1235 362 H1320" class="arrow"/><path d="M1235 447 H1320" class="arrow"/><text x="70" y="530" class="tiny">Only Frontend, Gateway, and Keycloak are public. Order, Product, Payment, and Inventory services are private on Render.</text>
</svg>
